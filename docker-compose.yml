services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-norman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-norman}
      POSTGRES_DB: ${POSTGRES_DB:-norman}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-norman}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps:/app/apps:ro
      - ./packages:/app/packages:ro
      - ./migrations:/app/migrations:ro

volumes:
  postgres_data:
