# Production mosquitto config.
#
# Two listeners:
#   8883 — public, TLS. Carl hubs connect here as mqtts://mqtt.<domain>:8883.
#          Published to the host; the GCP firewall allows it from anywhere.
#   1883 — plain, for the apps/ingest container only. Deliberately NOT
#          published to the host by docker-compose.prod.yml, so it is
#          reachable solely over the internal docker bridge network.
#
# Auth is declared before any listener block, so it applies globally to BOTH
# listeners — apps/ingest must supply MQTT_USERNAME / MQTT_PASSWORD too.
#
# Mounted at /mosquitto/config/mosquitto.conf by docker-compose.prod.yml,
# alongside:
#   /mosquitto/config/passwd        (mosquitto_passwd output)
#   /mosquitto/certs/fullchain.pem  (Let's Encrypt, via certbot on the host)
#   /mosquitto/certs/privkey.pem

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Public TLS listener (Carl hubs) ---
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# --- Internal plain listener (apps/ingest, docker network only) ---
# No cert directives here on purpose — this block must stay plaintext, and
# mosquitto applies TLS settings only to the listener block they follow.
listener 1883
protocol mqtt
