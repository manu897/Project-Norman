# Local-dev Mosquitto: anonymous on 1883.
# Production should set `password_file` + `acl_file` and listen on 8883 with TLS.
# Carl publishes on `carl/{site_id}/{node_id}`.

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
