# Mosquitto config for the home-network deployment.
#
# Only ONE listener is needed here, and it's plaintext — because the Carl hubs
# live on the same LAN as Norman. MQTT never crosses the internet in this
# topology, so there is no TLS to terminate, no Let's Encrypt cert to obtain,
# and no 90-day renewal dance. That whole layer (mosquitto.prod.conf, certbot,
# port 8883) exists only for the cloud deployment.
#
# Password auth is still on. It's cheap, and it means a random device joining
# your Wi-Fi can't inject fake plant readings.
#
# Mounted at /mosquitto/config/mosquitto.conf by docker-compose.home.yml,
# alongside /mosquitto/config/passwd (mosquitto_passwd output).

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Serves both the Carl hubs (over the LAN) and the apps/ingest container
# (over the internal docker network). Published to the LAN by the compose file.
listener 1883
protocol mqtt
